# GitHub Pages: deploy static site from the main branch (root).
# In repo Settings → Pages, choose "Deploy from a branch", branch main, folder / (root).
# This workflow is optional: it verifies the site files and can be removed if you rely only on branch deploy.

name: Verify GitHub Pages site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check required entry files
        run: |
          test -f index.html
          test -f style.css
          test -f script.js
          test -f .nojekyll
          echo "Static site files OK for branch deploy from main."
