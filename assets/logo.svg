<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" role="img" aria-labelledby="logo-title logo-desc">
  <title id="logo-title">رستوران چتر آبی — Blue Umbrella Restaurant</title>
  <desc id="logo-desc">لوگوی مدرن و مینیمال رستوران چتر آبی؛ ترکیب چتر آبی لاجوردی و سرپوش غذای اصیل ایرانی</desc>
  <defs>
    <linearGradient id="royal-navy" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f3c68" />
      <stop offset="100%" stop-color="#071e36" />
    </linearGradient>
    <linearGradient id="cerulean" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4cc9f0" />
      <stop offset="100%" stop-color="#1669a8" />
    </linearGradient>
    <linearGradient id="azure-bright" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#80ffdb" stop-opacity="0.2" />
      <stop offset="15%" stop-color="#72ddf7" />
      <stop offset="100%" stop-color="#1d84c6" />
    </linearGradient>
    <linearGradient id="saffron-gold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c89228" />
      <stop offset="50%" stop-color="#f3cd74" />
      <stop offset="100%" stop-color="#c89228" />
    </linearGradient>
  </defs>

  <g transform="translate(180, 78)">
    <path
      d="M-68 6 A68 68 0 0 1 68 6"
      fill="none"
      stroke="url(#saffron-gold)"
      stroke-width="2"
      stroke-linecap="round"
    />
    <circle cx="0" cy="-69" r="3.8" fill="url(#saffron-gold)" />
    <path
      d="M-4 -59 C-35 -56 -60 -32 -63 3 C-50 -4 -37 -3 -28 4 C-25 -26 -14 -48 -4 -59 Z"
      fill="url(#royal-navy)"
    />
    <path
      d="M-2 -59 C-12 -48 -22 -26 -25 4 C-17 -3 -9 -3 -2 4 Z"
      fill="url(#cerulean)"
    />
    <path
      d="M2 -59 L2 4 C9 -3 17 -3 25 4 C22 -26 12 -48 2 -59 Z"
      fill="url(#azure-bright)"
    />
    <path
      d="M4 -59 C14 -48 25 -26 28 4 C37 -3 50 -4 63 3 C60 -32 35 -56 4 -59 Z"
      fill="url(#royal-navy)"
    />
    <path
      d="M0 4 L0 25 C0 33 -11 33 -11 25.5"
      fill="none"
      stroke="url(#royal-navy)"
      stroke-width="3.8"
      stroke-linecap="round"
    />
    <path
      d="M-48 16 Q0 28 48 16"
      fill="none"
      stroke="url(#saffron-gold)"
      stroke-width="2.2"
      stroke-linecap="round"
