  <text
    x="180"
    y="150"
    text-anchor="middle"
    font-family="Vazirmatn, system-ui, sans-serif"
    font-size="35"
    font-weight="800"
    fill="#071e36"
  >چتر آبی</text>

  <text
    x="180"
    y="177"
    text-anchor="middle"
    font-family="Vazirmatn, 'Helvetica Neue', Arial, sans-serif"
    font-size="16.5"
    font-weight="800"
    fill="#1669a8"
