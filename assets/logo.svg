  >BLUE UMBRELLA</text>

  <g transform="translate(180, 198)">
    <line x1="-78" y1="-3.5" x2="-42" y2="-3.5" stroke="url(#saffron-gold)" stroke-width="1.5" stroke-linecap="round" />
    <text
      x="0"
      y="0"
      text-anchor="middle"
      font-family="Vazirmatn, system-ui, sans-serif"
      font-size="9.5"
      font-weight="700"
